<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Japan Inner Trip｜你真正適合的日本旅行</title>
  <meta name="description" content="用幾個直覺問題找到最適合你的日本目的地，以及最適合去北海道的季節。" />
  <style>
    :root{
      --bg:#f6f2ed;
      --card:#fffdfa;
      --ink:#26221f;
      --muted:#7b746c;
      --line:#e8dfd7;
      --accent:#e37a68;
      --accent2:#5f7489;
      --shadow:0 18px 52px rgba(43,32,22,.10);
      --radius:28px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      color:var(--ink);
      background:
        radial-gradient(circle at 0% 0%, rgba(227,122,104,.13), transparent 24rem),
        radial-gradient(circle at 100% 10%, rgba(95,116,137,.12), transparent 26rem),
        var(--bg);
      font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif;
      min-height:100vh;
    }
    img{display:block;max-width:100%}
    button{font:inherit}
    .wrap{width:min(940px, calc(100% - 28px)); margin:auto}
    header{padding:54px 0 28px}
    .eyebrow{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 12px;border-radius:999px;background:#fff7f3;border:1px solid #f0d7d0;
      color:#aa554a;font-size:13px;font-weight:800;
    }
    h1{font-size:clamp(34px,6vw,64px);line-height:1.03;letter-spacing:-.045em;margin:18px 0 14px}
    .lead{max-width:760px;font-size:18px;line-height:1.8;color:var(--muted)}
    .menu{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin:28px 0 56px}
    .mode{
      text-align:left;border:0;border-radius:24px;padding:25px;background:rgba(255,255,255,.84);
      box-shadow:var(--shadow);cursor:pointer;color:var(--ink);transition:.2s transform,.2s box-shadow;
    }
    .mode:hover{transform:translateY(-3px);box-shadow:0 22px 68px rgba(43,32,22,.14)}
    .mode .icon{font-size:34px;display:block;margin-bottom:18px}
    .mode strong{display:block;font-size:23px;margin-bottom:10px}
    .mode span{line-height:1.65;color:var(--muted)}
    .panel{display:none;padding-bottom:70px}
    .panel.active{display:block}
    .quiz-card,.result-card{
      background:rgba(255,253,250,.94);
      border:1px solid rgba(228,219,209,.92);
      border-radius:var(--radius);
      padding:clamp(22px,4vw,38px);
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
    }
    .topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
    .mini{font-size:14px;color:var(--muted)}
    .progress{height:10px;border-radius:999px;background:#ebe2d9;overflow:hidden;margin-bottom:28px}
    .bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#efb272);transition:.32s}
    .q{font-size:clamp(24px,4vw,36px);line-height:1.33;margin:0 0 24px;letter-spacing:-.02em}
    .subtle{margin:-6px 0 18px;color:#8a8179;font-size:14px;line-height:1.6}
    .answers{display:grid;gap:12px}
    .answer{
      width:100%;border:1px solid var(--line);background:#fff;border-radius:18px;padding:18px 19px;
      text-align:left;cursor:pointer;transition:.16s;border-color:#e6ddd4;color:var(--ink);
      display:flex;gap:13px;align-items:flex-start;
    }
    .answer:hover{border-color:#c8a699;transform:translateY(-1px);background:#fffaf7}
    .answer b{
      flex:0 0 29px;width:29px;height:29px;border-radius:50%;display:grid;place-items:center;
      background:#f3ece6;color:#7a6256;font-size:13px
    }

    .image-grid{
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;
    }
    .image-option{
      border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#fff;cursor:pointer;
      transition:.18s transform,.18s border-color,.18s box-shadow; text-align:left; padding:0;
      box-shadow:0 6px 16px rgba(0,0,0,.03);
    }
    .image-option:hover{transform:translateY(-2px);border-color:#c8a699;box-shadow:0 12px 28px rgba(0,0,0,.07)}
    .image-option .ph{
      aspect-ratio: 16 / 10;
      background:#ddd;
      border-bottom:1px solid var(--line);
      overflow:hidden;
    }
    .image-option .ph img{
      width:100%;height:100%;object-fit:cover;
    }
    .image-option .meta{
      padding:14px 14px 16px;display:flex;gap:10px;align-items:flex-start;
    }
    .image-option .meta b{
      flex:0 0 28px;width:28px;height:28px;border-radius:50%;
      display:grid;place-items:center;background:#f3ece6;color:#7a6256;font-size:13px
    }
    .image-option .meta span{line-height:1.55;color:var(--ink)}
    .helper{
      margin-top:10px;font-size:13px;color:#8b827a;
    }

    .back{margin-top:22px;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:8px 0}
    .result-kicker{font-size:14px;font-weight:900;color:var(--accent);letter-spacing:.12em}
    .result-card h2{font-size:clamp(34px,5vw,56px);line-height:1.08;letter-spacing:-.04em;margin:8px 0 10px}
    .result-desc{font-size:18px;line-height:1.8;color:#645d57}
    .tags{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 26px}
    .tag{padding:8px 12px;border-radius:999px;background:#f1ebe5;color:#645850;font-size:14px}
    .insight{padding:20px;border-radius:20px;background:#f6f1eb;margin-top:16px;line-height:1.8}
    .insight strong{display:block;margin-bottom:6px}
    .scorebox{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0}
    .score{background:#fff;border:1px solid var(--line);padding:13px;border-radius:16px;text-align:center}
    .score small{display:block;color:var(--muted);margin-bottom:4px}
    .score b{font-size:18px}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
    .primary,.secondary{border:0;border-radius:14px;padding:13px 17px;cursor:pointer;font-weight:800}
    .primary{background:var(--ink);color:#fff}
    .secondary{background:#eee6de;color:var(--ink)}
    .note{font-size:13px;color:#8b827b;line-height:1.65;margin-top:18px}
    footer{padding:18px 0 48px;color:#9b928b;font-size:13px;text-align:center}
    @media (max-width:720px){
      header{padding-top:34px}
      .menu{grid-template-columns:1fr}
      .scorebox{grid-template-columns:repeat(2,1fr)}
    }
    @media (max-width:560px){
      .image-grid{grid-template-columns:1fr}
      .quiz-card,.result-card{border-radius:24px}
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">✦ 旅行心理測驗 v2</span>
    <h1>你真正想去的日本，<br>可能跟你想像的不太一樣。</h1>
    <p class="lead">我把測驗調整成更像「旅遊心理測驗」：北海道季節題加入圖片卡，去日本哪裡也加入影視作品偏好，用你真正會被什麼氛圍打中，來推測目的地與旅行狀態。</p>
  </header>

  <section id="home">
    <div class="menu">
      <button class="mode" onclick="startQuiz('japan')">
        <span class="icon">🗾</span>
        <strong>我最適合去日本哪裡？</strong>
        <span>18 題。加入影視作品偏好、旅行節奏、美食／自然／文化傾向，找到最適合你的日本地區。</span>
      </button>
      <button class="mode" onclick="startQuiz('hokkaido')">
        <span class="icon">❄️</span>
        <strong>我最適合哪個季節去北海道？</strong>
        <span>14 題。用場景圖片、溫度接受度、景色偏好與活動型態，找到最對味的北海道季節。</span>
      </button>
    </div>
  </section>

  <section id="quiz" class="panel">
    <div class="quiz-card">
      <div class="topline">
        <span id="quizTitle" class="mini"></span>
        <span id="counter" class="mini"></span>
      </div>
      <div class="progress"><div id="bar" class="bar"></div></div>
      <h2 id="question" class="q"></h2>
      <p id="subtle" class="subtle"></p>
      <div id="answers" class="answers"></div>
      <button id="backBtn" class="back" onclick="goBack()">← 上一題</button>
    </div>
  </section>

  <section id="result" class="panel">
    <div class="result-card">
      <div id="resultKicker" class="result-kicker"></div>
      <h2 id="resultTitle"></h2>
      <p id="resultDesc" class="result-desc"></p>
      <div id="tags" class="tags"></div>
      <div id="scores" class="scorebox"></div>
      <div class="insight">
        <strong>你內心深處其實在找：</strong>
        <span id="innerText"></span>
      </div>
      <div class="insight">
        <strong>旅行時最容易踩的雷：</strong>
        <span id="warningText"></span>
      </div>
      <div class="actions">
        <button class="primary" onclick="restartSame()">再測一次</button>
        <button class="secondary" onclick="goHome()">換另一個測驗</button>
        <button class="secondary" onclick="copyResult()">複製結果</button>
      </div>
      <p class="note">※ 目前圖片題我先做成內建風格插圖版，這樣可以確保單檔 HTML 直接打開就能用。若你要，我下一版可以再幫你換成真實網路照片版。</p>
    </div>
  </section>

  <footer>Japan Inner Trip · a small site for people who plan trips with their feelings first.</footer>
</div>

<script>
const quizzes = {
  japan: {
    title: "最適合去日本哪裡？",
    dimensions: ["urban","culture","nature","food","slow"],
    questions: [
      {text:"如果明天突然多出三天假，你最想？", options:[
        ["逛到腳酸也甘願，越熱鬧越好","urban"],
        ["住進安靜小鎮，散步、發呆","slow"],
        ["直接去看山海，離城市越遠越好","nature"],
        ["吃遍當地名物，晚上繼續喝","food"]
      ]},
      {text:"旅行中，哪個瞬間最讓你有「活著真好」的感覺？", options:[
        ["凌晨還亮著的街","urban"],
        ["寺院、老街、木造建築","culture"],
        ["風景突然遼闊起來","nature"],
        ["吃到一口超乎預期的東西","food"]
      ]},
      {text:"哪種影視氛圍最容易打中你？", subtle:"這題不是考片單，是看你容易被哪種世界吸引。", options:[
        ["節奏快、都會感強、人物很多的作品","urban"],
        ["有老街、四季、美感細節的作品","culture"],
        ["山海、公路、鄉間、療癒感作品","nature"],
        ["圍繞吃飯、人情味、深夜小店的作品","food"]
      ]},
      {text:"如果旅館晚上只能播一部作品，你會選？", subtle:"用偏好來判斷你更容易進入哪種旅行情緒。", options:[
        ["《First Love》那種城市與情感交錯感","urban"],
        ["《舞伎家的料理人》那種京都日常與美感","culture"],
        ["《小森林》那種鄉間節奏與自然感","nature"],
        ["《深夜食堂／孤獨的美食家》那種吃飯即故事","food"]
      ]},
      {text:"你比較能接受哪一種累？", options:[
        ["走兩萬步但看到超多東西","urban"],
        ["搭很久的車只為了一個景","nature"],
        ["排隊等名店","food"],
        ["早起去看沒有人的景點","slow"]
      ]},
      {text:"你對『觀光景點』的態度？", options:[
        ["第一次去就該看經典","culture"],
        ["熱門也沒關係，好玩最重要","urban"],
        ["最好避開人群","slow"],
        ["只要景色夠強，人多也可以","nature"]
      ]},
      {text:"選一個晚上。", options:[
        ["酒吧、夜景、便利商店宵夜","urban"],
        ["居酒屋、燒鳥、拉麵","food"],
        ["溫泉旅館，十點就睡","slow"],
        ["海邊或山裡，看星星","nature"]
      ]},
      {text:"你最不能忍受的旅行狀況？", options:[
        ["交通不方便","urban"],
        ["人太多、一直排隊","slow"],
        ["沒有好吃的","food"],
        ["景色普通、沒有記憶點","nature"]
      ]},
      {text:"如果只能拍一種照片？", options:[
        ["霓虹街景與人群","urban"],
        ["神社、町屋、歷史感","culture"],
        ["海岸、山、湖、雪","nature"],
        ["食物與市場","food"]
      ]},
      {text:"你現在的人生狀態比較像？", options:[
        ["需要刺激，想把自己重新開機","urban"],
        ["很累，想安靜消失幾天","slow"],
        ["有點卡住，想得到新的視角","nature"],
        ["想好好獎勵自己","food"]
      ]},
      {text:"哪種角色視角最吸引你？", subtle:"這題用來抓你是想『參與』還是『退開』。", options:[
        ["在城市中快速穿梭、每天都可能有新事發生","urban"],
        ["在舊街區慢慢生活、理解地方脈絡","culture"],
        ["離開原本生活，到遠方重新感受世界","nature"],
        ["一邊吃、一邊遇見人、一邊被治癒","food"]
      ]},
      {text:"你理想的行程密度？", options:[
        ["早九到晚十一，塞滿沒關係","urban"],
        ["一天 2–3 個重點最好","culture"],
        ["一天只安排一件事也可以","slow"],
        ["看天氣和心情，隨時改","nature"]
      ]},
      {text:"對購物的感覺？", options:[
        ["旅行重要主線之一","urban"],
        ["會買設計、工藝或地方限定","culture"],
        ["可有可無","nature"],
        ["主要買吃的","food"]
      ]},
      {text:"哪個詞最吸引你？", options:[
        ["效率","urban"],
        ["餘韻","culture"],
        ["自由","nature"],
        ["滿足","food"]
      ]},
      {text:"你比較喜歡哪種空間？", options:[
        ["高樓、地下街、大車站","urban"],
        ["古城、庭園、巷弄","culture"],
        ["港口、山谷、海岸","nature"],
        ["市場、商店街、屋台","food"]
      ]},
      {text:"旅行最重要的是？", options:[
        ["選擇夠多，不怕無聊","urban"],
        ["有故事、有歷史、有細節","culture"],
        ["可以真正離開日常","nature"],
        ["吃得超級好","food"]
      ]},
      {text:"你對『名店』的耐心？", options:[
        ["值得就排","food"],
        ["最多 20 分鐘","urban"],
        ["不排，旁邊隨便找","slow"],
        ["我寧願去景點","nature"]
      ]},
      {text:"最後一題：你最希望旅行回來後變成哪種狀態？", options:[
        ["重新有能量","urban"],
        ["心變得更安定","slow"],
        ["覺得世界又變大了","nature"],
        ["覺得人生有被好好款待","food"]
      ]}
    ],
    results:[
      {key:"urban", title:"東京", kicker:"CITY ENERGY", tags:["刺激","選擇很多","夜生活","效率"], desc:"你需要的不是單純休息，而是大量新訊息把腦袋重新點亮。東京的密度、速度與無限分支，會讓你在『今天到底還能發生什麼？』的感覺裡重新有電。", inner:"你其實在找「重新啟動感」。最近如果生活有點平，你會比一般人更需要陌生感、速度與選擇權來恢復精神。", warning:"把行程排得太滿。你很容易因為怕錯過而把旅行變成 KPI。留一個晚上完全不排，通常反而會成為記憶最深的一段。"},
      {key:"culture", title:"京都・金澤", kicker:"QUIET AESTHETICS", tags:["文化","美感","散步","細節"], desc:"你對旅行的要求不只『好玩』，還希望它有脈絡、有美感、有值得慢慢看的細節。京都與金澤都適合你把速度降下來，靠街道、工藝、庭園與歷史累積餘韻。", inner:"你其實在找「秩序與意義」。你想暫時離開資訊噪音，進到一個有脈絡、有美感、有時間感的世界。", warning:"只跑熱門景點。你的滿足感其實很吃『空白』，比起多塞兩個寺院，你更需要留時間在巷弄、茶屋或庭園坐久一點。"},
      {key:"nature", title:"北海道・東北", kicker:"BIG LANDSCAPE", tags:["自然","公路感","自由","遼闊"], desc:"你真正會被治癒的通常不是漂亮咖啡廳，而是尺度夠大的風景。北海道或東北的距離、山海與季節變化，很適合你把腦袋從日常尺寸拉回更大的世界。", inner:"你其實在找「空間感」。你想離開被工作、訊息與城市切碎的注意力，重新感覺自己可以呼吸、可以走遠。", warning:"低估交通。你會想追求自由，但日本鄉間班次與距離很現實；預留交通 buffer，或直接自駕，會比硬塞點位更適合你。"},
      {key:"food", title:"大阪・福岡", kicker:"EAT FIRST, THINK LATER", tags:["美食","熱鬧","親切","夜晚"], desc:"對你來說，旅行最重要的記憶常常可以被一句『那家真的超好吃』喚醒。大阪與福岡有很強的街頭飲食、夜間氣氛和低門檻快樂，適合你一路吃、一路逛、一路聊天。", inner:"你其實在找「被生活款待的感覺」。你不一定需要宏大的療癒，你要的是很多小小的、立刻有回報的快樂。", warning:"為了名店犧牲太多時間。你很容易追著清單吃，最後肚子飽了、行程卻很累。保留幾餐現場看心情決定。"},
      {key:"slow", title:"四國・瀨戶內・溫泉小鎮", kicker:"SLOW RESET", tags:["安靜","慢旅行","溫泉","發呆"], desc:"你最需要的是降低外界要求。比起『去了哪裡』，你更重視自己在旅途中有沒有真的鬆下來。四國、瀨戶內或溫泉小鎮的節奏會比大城市更接近你現在需要的狀態。", inner:"你其實在找「被允許什麼都不做」。你可能已經很習慣處理事情、回應別人，旅行反而需要一個不用證明效率的地方。", warning:"又忍不住加行程。你最適合的玩法，是每天只設一個 anchor，其餘全部留白。"}
    ]
  },

  hokkaido: {
    title: "最適合哪個季節去北海道？",
    dimensions: ["winter","spring","summer","autumn"],
    questions: [
      {text:"你可以接受零下溫度嗎？", options:[
        ["可以，越有冬天感越好","winter"],
        ["可以一點，但不要太硬核","spring"],
        ["最好舒服，不想受罪","summer"],
        ["偏涼最棒","autumn"]
      ]},
      {text:"你最想在旅程中看到哪個畫面？", subtle:"改成圖片卡，讓使用者用第一直覺選。", type:"image", options:[
        {label:"整座城市被雪覆住", key:"winter", scene:"winter-city"},
        {label:"櫻花、融雪、剛醒來的草地", key:"spring", scene:"spring-field"},
        {label:"花田、藍天、綠色丘陵", key:"summer", scene:"summer-field"},
        {label:"紅葉、金色草原、初雪山頭", key:"autumn", scene:"autumn-hills"}
      ]},
      {text:"你對人潮的容忍度？", options:[
        ["為了經典景色可以接受","summer"],
        ["越少越好","spring"],
        ["有節慶感反而更開心","winter"],
        ["希望有氣氛但別太擠","autumn"]
      ]},
      {text:"北海道旅行最吸引你的核心是？", options:[
        ["雪國感","winter"],
        ["萬物甦醒的清新感","spring"],
        ["公路旅行與大自然","summer"],
        ["食物與季節感","autumn"]
      ]},
      {text:"選一個活動。", options:[
        ["滑雪／雪地活動","winter"],
        ["賞櫻＋泡湯","spring"],
        ["自駕看花田與湖泊","summer"],

function startQuiz(type){
  currentType = type;
  idx = 0;
  history = [];
  score = {};
  quizzes[type].dimensions.forEach(k => score[k] = 0);
  document.getElementById('home').style.display = 'none';
  document.getElementById('result').classList.remove('active');
  document.getElementById('quiz').classList.add('active');
  renderQuestion();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderQuestion(){
  const quiz = quizzes[currentType];
  const qObj = quiz.questions[idx];
  const isImage = qObj.type === 'image';

  document.getElementById('quizTitle').textContent = quiz.title;
  document.getElementById('counter').textContent = `${idx + 1} / ${quiz.questions.length}`;
  document.getElementById('bar').style.width = `${(idx / quiz.questions.length) * 100}%`;
  document.getElementById('question').textContent = qObj.text;
  document.getElementById('subtle').textContent = qObj.subtle || '';
  document.getElementById('subtle').style.display = qObj.subtle ? 'block' : 'none';

  const box = document.getElementById('answers');
  box.className = isImage ? 'image-grid' : 'answers';
  box.innerHTML = '';

  qObj.options.forEach((opt, i) => {
    const letter = String.fromCharCode(65 + i);
    const key = isImage ? opt.key : opt[1];
    const label = isImage ? opt.label : opt[0];

    if(isImage){
      const btn = document.createElement('button');
      btn.className = 'image-option';
      btn.innerHTML = `
        <div class="ph"><img src="${svgScene(opt.scene)}" alt="${label}"></div>
        <div class="meta"><b>${letter}</b><span>${label}</span></div>
      `;
      btn.onclick = () => answer(key);
      box.appendChild(btn);
    } else {
      const btn = document.createElement('button');
      btn.className = 'answer';
      btn.innerHTML = `<b>${letter}</b><span>${label}</span>`;
      btn.onclick = () => answer(key);
      box.appendChild(btn);
    }
  });

  if(isImage){
    const helper = document.createElement('div');
    helper.className = 'helper';
    helper.textContent = '小提醒：這類題目用第一眼直覺作答最準。';
    box.appendChild(helper);
  }

  document.getElementById('backBtn').style.visibility = idx === 0 ? 'hidden' : 'visible';
}

function answer(key){
  score[key]++;
  history.push(key);
  idx++;
  if(idx >= quizzes[currentType].questions.length){
    showResult();
  } else {
    renderQuestion();
  }
}

function goBack(){
  if(idx === 0) return;
  idx--;
  const last = history.pop();
  score[last]--;
  renderQuestion();
}

function showResult(){
  const quiz = quizzes[currentType];
  const max = Math.max(...quiz.dimensions.map(k => score[k]));
  const candidates = quiz.dimensions.filter(k => score[k] === max);
  let winner = candidates[0];
  for(let i = history.length - 1; i >= 0; i--){
    if(candidates.includes(history[i])){
      winner = history[i];
      break;
    }
  }
  const res = quiz.results.find(r => r.key === winner);

  document.getElementById('quiz').classList.remove('active');
  document.getElementById('result').classList.add('active');
  document.getElementById('resultKicker').textContent = res.kicker;
  document.getElementById('resultTitle').textContent = res.title;
  document.getElementById('resultDesc').textContent = res.desc;
  document.getElementById('innerText').textContent = res.inner;
  document.getElementById('warningText').textContent = res.warning;
  document.getElementById('tags').innerHTML = res.tags.map(t => `<span class="tag">${t}</span>`).join('');

  const labels = currentType === 'japan'
    ? {urban:'城市刺激', culture:'文化美感', nature:'自然遼闊', food:'吃喝滿足', slow:'放空需求'}
    : {winter:'冬季傾向', spring:'春季傾向', summer:'夏季傾向', autumn:'秋季傾向'};

  const sorted = quiz.dimensions.map(k => [k, score[k]]).sort((a,b) => b[1] - a[1]);
  document.getElementById('scores').innerHTML = sorted.slice(0,4).map(([k,v]) =>
    `<div class="score"><small>${labels[k]}</small><b>${v}</b></div>`
  ).join('');

  window.scrollTo({top:0, behavior:'smooth'});
}

function restartSame(){ startQuiz(currentType); }
function goHome(){
  currentType = null;
  document.getElementById('result').classList.remove('active');
  document.getElementById('quiz').classList.remove('active');
  document.getElementById('home').style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}

async function copyResult(){
  const text = `我的 Japan Inner Trip 結果：${document.getElementById('resultTitle').textContent}\n${document.getElementById('resultDesc').textContent}\n內心深處：${document.getElementById('innerText').textContent}`;
  try{
    await navigator.clipboard.writeText(text);
    alert('結果已複製！');
  }catch(e){
    prompt('複製這段文字：', text);
  }
}
